<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link href="./main.css" rel="stylesheet" type="text/css" media="all">
    <link rel="stylesheet" href="./visitorCounter.css" type="text/css" media="all">
    <script src="./main.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/src/assets/titleSite.js"></script>
    <script>
    let player;
    
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player', {
            width: '200',
            height: '200',
            videoId: 'c2Xd09ADfyE',
            playerVars: {
                autoplay: 1,
                controls: 0,
                loop: 1,
                playlist: 'c2Xd09ADfyE'
            },
            events: {
                onReady: function(event) {
                    event.target.setVolume(10);
                    event.target.playVideo();
                }
            }
        });
    }
    </script>
  </head>
  <body>   
    <div class="screen-wrapper">
        <div class="screen start">
                <div id="youtube-player"
                    style="position:absolute; opacity:0; pointer-events:none;">
                </div>
            <main class="main-page">
                <div class="title-menu">
                    <h1 class="title">Welcome to my personal site</h1>
                </div>    
                <nav>
                    <ul class="navbar">
                        <li class="pages"><a href="https://johnnythestrangeguy.neocities.org/src/pages/art">Home</a></li>
                        <li class="pages"><a href="https://johnnythestrangeguy.neocities.org/src/pages/art">Art</a></li>
                        <li class="pages"><a href="https://johnnythestrangeguy.neocities.org/src/pages/art">Robotic</a></li>
                        <li class="pages"><a href="https://johnnythestrangeguy.neocities.org/src/pages/art">Codes</a></li>
                        <li class="pages"><a href="https://johnnythestrangeguy.neocities.org/src/pages/art">Movies</a></li>
                        <li class="pages"><a href="https://johnnythestrangeguy.neocities.org/src/pages/art">Games</a></li>
                        <li>
                            <div class="visitorCounterDisplay">
                                <div class="digit" data-n="#" id="visitorCount">...</div>
                            </div>
                            <script>
                            async function loadVisitors() {
                                try {
                                    const response = await fetch(
                                        "http://localhost:3000/api/neocities-info"
                                    );

                                    if (!response.ok) {
                                        throw new Error(`HTTP ${response.status}`);
                                    }

                                    const data = await response.json();

                                    const views = data.info.views;

                                    document.getElementById("visitorCount").textContent =
                                        String(views).padStart(6, "0");

                                } catch (error) {
                                    console.error("Erro:", error);
                                }
                            }

                            loadVisitors();
                            </script>
                        </li>
                    </ul>
                </nav>
                <div class="uploads">
                    <ul class="under_constructions">
                        <li class="constructions">
                            <img src="/src/img/under_construction.gif" alt="Github">
                        </li>
                    </ul>
                    <!-- <p>Check out my GitHub for the latest updates!</p>
                    <a href="https://github.com/DevJhonathas/90blog"><img class="github" src="/src/img/github.png" alt="Github"></a> -->
                </div>
            </main>
        </div>
    </div>
  </body>
</html>
