<!DOCTYPE html>
<html lang="en">
<head>
  <title>Simple Music Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/src/pages/books.css">
</head>
<body>
  <div id="music-player">
    <div id="youtube-player"></div>
    <img id="song-image" src="/src/img/backgrounds/dangaronpa.webp">
    <div class="marquee-container">
      <div class="marquee-content">
        <p id="song-name">Song</p>  
      </div>
    </div>
    <div id="song-artist">Artist</div>

    <input type="range" name="" id="slider-song">

    <div id="music-buttons">
      <i id="shuffle-song" class="fa-solid fa-shuffle"></i>
      <i id="prev-song" class="fa-solid fa-backward-step"></i>
      <i id="playpause-song" class="fa-solid fa-circle-play fa-2x"></i>
      <i id="next-song" class="fa-solid fa-forward-step"></i>
      <i id="repeat-song" class="fa-solid fa-repeat"></i>
    </div>
  </div>


<script src="../music_player.js"></script>
</body>
</html>
